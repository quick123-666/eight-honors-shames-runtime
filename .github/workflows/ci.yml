name: CI

# 八荣八耻 runtime 质量门禁:推送/PR 时自动跑测试 + 规则校验 + 注释校验
# 注意:GitHub Actions 只在【仓库根】的 .github/workflows/ 生效。
# 本文件随项目(runtime 独立成仓或移到仓库根)即启用。
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Quality gates (rules sync + annotations)
        run: npm run check

      - name: Deterministic benchmark
        run: npm run benchmark
